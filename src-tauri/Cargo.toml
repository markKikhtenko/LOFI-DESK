[package]
name = "lofi-desk"
version = "0.2.2"
description = "Спокойный настольный музыкальный плеер"
authors = ["Mark Kikhtenko"]
edition = "2021"
license = "MIT"
repository = "https://github.com/markKikhtenko/LOFI-DESK"

[lib]
name = "lofi_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
walkdir = "2"
